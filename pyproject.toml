[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "modelwatch"
version = "0.1.0"
description = "Persistent ML monitoring reference implementation"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.128.2", "uvicorn==0.40.0", "pydantic==2.12.5",
  "pandas==2.2.3", "numpy==2.3.5", "scikit-learn==1.8.0",
  "evidently==0.7.23", "streamlit==1.50.0", "plotly==5.24.1",
  "joblib==1.5.3", "httpx==0.28.1"
]
[project.optional-dependencies]
dev = ["pytest==9.0.2", "ruff==0.14.3"]
[project.scripts]
modelwatch = "modelwatch.cli:main"
[tool.setuptools.packages.find]
include = ["modelwatch*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
pythonpath = ["."]
